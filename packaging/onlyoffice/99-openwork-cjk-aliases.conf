<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Serif (Song / FangSong) -->
  <alias binding="weak">
    <family>宋体</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>新宋体</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>SimSun</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>NSimSun</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>仿宋</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>仿宋_GB2312</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>FangSong</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>方正小标宋</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>小标宋</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>

  <!-- Sans (Hei / Deng / YaHei) -->
  <alias binding="weak">
    <family>黑体</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Zen Hei</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>SimHei</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Zen Hei</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>等线</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>DengXian</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>微软雅黑</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>Microsoft YaHei</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>

  <!-- Kai -->
  <alias binding="weak">
    <family>楷体</family>
    <prefer>
      <family>AR PL UKai CN</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>楷体_GB2312</family>
    <prefer>
      <family>AR PL UKai CN</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>KaiTi</family>
    <prefer>
      <family>AR PL UKai CN</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>

  <!-- Common macOS / vendor fonts seen in bid templates -->
  <alias binding="weak">
    <family>苹方-简</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>苹方</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>PingFang SC</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>.AppleSystemUIFont</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>汉仪中黑KW</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>汉仪书宋二KW</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>
</fontconfig>
